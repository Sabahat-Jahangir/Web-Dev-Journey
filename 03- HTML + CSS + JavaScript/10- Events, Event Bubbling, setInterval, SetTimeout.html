<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <div class="container">
        <div class="box">
            Aoa, I am a box
        </div>
    </div>
    <button id = "btn">Change Content</button>
</body>

<script>
    let button = document.getElementById("btn");
    // button.addEventListener("click", ()=> {
    //     // alert("I was Clicked")
    //     document.querySelector(".box").innerHTML = "You are Clicked"
    // })
    button.addEventListener("dblclick", ()=> {
        // alert("I was Clicked")
        document.querySelector(".box").innerHTML = "You are Clicked"
    })
    
    </script>
</html>
