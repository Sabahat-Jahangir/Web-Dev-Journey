<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <script>
        console.log("Assalamoalaikum.....")
        function nice(name) {
            console.log("Hey "+ name + " you are Beautiful!")
            console.log("Hey "+ name + " you are nice!")
            console.log("Hey "+ name + " you are amazing!")
        }
        nice("Sabahat")
        nice("Sabgeer")

        function sum(a, b, c=3) {
            // console.log(a + b)
            return a + b + c
        }
        result = sum(3 , 5);
        console.log("The sum of two given numbers is: ", result)

        const func1 = (x) =>{
            console.log("I am an arrow function ",x )
        }
        func1(23);
    </script>

</body>
</html>
