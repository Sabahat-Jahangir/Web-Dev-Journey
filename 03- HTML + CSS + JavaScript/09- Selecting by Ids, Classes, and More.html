<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecting by Ids, Classes, and More</title>
    <style>
        .box{
            height: 45px;
            width: 56px;
            margin: 5px;
            padding: 5px;
            border: 2px solid Black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Hello World</div>
        <div class="box">Hello World</div>
        <div class="box">Hello World</div>
        <div id="redbox" class="box">Hello World</div>
        <div class="box">Hello World</div>
        <div class="box">Hello World</div>
    </div>
    <script>
        // console.log("Hello......")
        // let helloworld = document.getElementsByClassName("box")
        // console.log(helloworld);
        // helloworld[3].style.backgroundColor = "red";


        // document.getElementById("redbox").style.backgroundColor = "red";

         // document.querySelector('.box').style.backgroundColor = "green";

        // You cannot use queryselectorall without loop
        // document.querySelectorAll('.box').style.backgroundColor = "green";
       
        document.querySelectorAll('.box').forEach(e => {
            e.style.backgroundColor = "red";
        })



    </script>
</body>
</html>
