<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings</title>
</head>
<body>
    <script>
        console.log("This is Strings Practice workspace")
        let a = "sabahat";
        console.log(a)
        console.log(a[0])
        console.log(a[1])
        console.log(a[2])
        console.log(a[3])
        console.log(a[4])
        console.log(a[5])
        console.log(a[6])
        console.log(a[7])

        console.log(a.length);
        let name = "Sabahat";
        let friend = "Shazia";

        console.log("Her name is " + name + " and her friend name is " + friend)
        // template Literals
        console.log(`Her name is ${name} and her friend name is ${friend}`)
        // Escape Sequence Characteristics
         let b ="Saba\"hat"

         let c= "SABAHAT"
         x = console.log(c.toLowerCase())
         console.log(x)
         console.log(c.slice(1,4))
         console.log(c.slice(4))
         console.log(c.concat(friend, "Shazia "))
         console.log(c.replace("AB","77"))
         let s= "hello world, I am happy :)"
         console.log(s.trim())
         
    </script>
</body>
</html>
