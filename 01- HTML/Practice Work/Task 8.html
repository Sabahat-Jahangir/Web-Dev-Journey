<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pete's Pizza Delivery</title>
</head>

<body>
    <center>
        <h1>Pete's Pizza Delivery</h1>
        <h2>Online Order Form</h2>
    </center>

    <form>

        <!-- Customer Information -->
        <label>*Name:</label>
        <input type="text" name="name" required>

        <label>*Tel:</label>
        <input type="tel" name="telephone" required>
        <br><br>

        <label>*Address:</label>
        <input type="text" name="address" required>

        <label>*Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>*Town/City:</label>
        <input type="text" name="city" required>
        <br><br>

        <label>*Postcode:</label>
        <input type="text" name="postcode" required>
        <br><br>


        <center>
            <p>* required fields</p>
        </center>

        <table border="0">
            <tr>
                <!-- Topping -->
                <td valign="top">
                    <h4>Topping</h4>
                    <input type="radio" name="topping" value="Margherita"> Margherita<br>
                    <input type="radio" name="topping" value="Four Seasons"> Four Seasons<br>
                    <input type="radio" name="topping" value="Meat Feast"> Meat Feast
                </td>

                <!-- Size -->
                <td valign="top">
                    <h4>Size</h4>
                    <input type="radio" name="size" value="small"> Small<br>
                    <input type="radio" name="size" value="medium"> Medium<br>
                    <input type="radio" name="size" value="large"> Large
                </td>

                <!-- Extras -->
                <td valign="top">
                    <h4>Extras</h4>
                    <input type="checkbox" name="extras" value="mushrooms"> Mushrooms<br>
                    <input type="checkbox" name="extras" value="green_peppers"> Green peppers<br>
                    <input type="checkbox" name="extras" value="anchovies"> Anchovies<br>
                    <input type="checkbox" name="extras" value="extra_cheese"> Extra cheese
                </td>
            </tr>
        </table>


        <!-- Delivery -->
        <label>Preferred delivery time:</label>
        <input type="time" name="delivery_time">
        <br><br>

        <label>Delivery instructions:</label><br>
        <textarea name="instructions" rows="4" cols="40"></textarea>
        <br>

        <!-- Submit Button -->
        <input type="submit" value="Submit order">

    </form>

</body>

</html>
