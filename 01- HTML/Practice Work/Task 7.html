<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Sign Up!</h1>
    <p>Please fill your details to get access your account :)</p>

    <form>
        <!-- Username -->
        <label for="username">User Name:</label><br>
        <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>
        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <!-- Password -->
        <label for="pwd">Password:</label><br>
        <input type="password" id="pwd" name="password" placeholder="Enter your password" required><br><br>
        <!-- Confirm Password -->
        <label for="Conpwd">Confirm Password:</label><br>
        <input type="password" id="Conpwd" name="Confirm_password" placeholder="Repeat password" required><br><br>
        <!-- Buttons -->
         <input type="submit" value="Submit">
         <input type="reset" value="Reset"

    </form>
    <p>New Here! Click Here to Register your Account <a href="#">Register</a> </p> 
    


</body>

</html>
