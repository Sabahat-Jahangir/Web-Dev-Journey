<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Lists</title>
</head>

<body>
    <ul type="square">
        <h1>Unordered List</h1>
        <li>Notebook</li>
        <li>Marker</li>
    </ul>
    <ol>
        <h1>Ordered List</h1>
        <li>Mango</li>
        <li>Orange</li>
        <li>Litchi</li>
    </ol>
    <ol type="A" start="3">
        <li>Pen</li>
        <li>Pencil</li>
    </ol>
</body>

</html>
