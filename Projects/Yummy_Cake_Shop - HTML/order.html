<main>
  <h2>Order Your Cake</h2>

  <form>
    <label>Customer Name:</label><br>
    <input type="text"><br><br>

    <label>Email:</label><br>
    <input type="email"><br><br>

    <label>Choose Cake Flavor:</label><br>
    <select>
      <option>Chocolate</option>
      <option>Vanilla</option>
      <option>Red Velvet</option>
    </select><br><br>

    <label>Size:</label><br>
    <input type="radio" name="size"> Small
    <input type="radio" name="size"> Medium
    <input type="radio" name="size"> Large<br><br>

    <label>Extra Toppings:</label><br>
    <input type="checkbox"> Choco Chips
    <input type="checkbox"> Fruits
    <input type="checkbox"> Nuts<br><br>

    <label>Special Message:</label><br>
    <textarea rows="4" cols="30"></textarea><br><br>

    <input type="submit" value="Place Order">
  </form>
</main>
