<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            filter: blur(2px)
        }
        .img2{
            filter: brightness(2) contrast(0.3);
        }
        .img3{
            filter: grayscale(100);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="../Projects/Beauty in Disorder (Art Gallery) - HTML/pics/Screenshot 2026-02-18 203105.png" alt="">
        <img class="img2" src="../Projects/Beauty in Disorder (Art Gallery) - HTML/pics/Screenshot 2026-02-18 203227.png" alt="">
        <img class="img3" src="../Projects/Beauty in Disorder (Art Gallery) - HTML/pics/Screenshot 2026-02-18 203802.png" alt="">

    </div>
</body>
</html>
