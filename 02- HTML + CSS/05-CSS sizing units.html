<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing Units</title>
    <style>
        *{
            margin:0;
            padding: 0;
        }
        html{
            font-size: 12px;
        }
        .box{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 100vw;
            
            /* vw stands for viewpoints */
            background-color: aquamarine;

        }
        .container{
            box-sizing: border-box;
            border: 2px solid black;
            width: 80vw;
            height: 10vh;
            font-size: 18px;
        }
        .mycont{
            background-color: red;
            color: yellowgreen;
            font-size: 22px;
            width: 100vmin;
            /* 100vmin = 100vh in monitor */
        }
        p{
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <div class="container">
        <p>Lorem ipsum dolor sit amet .</p>
    </div>
    <div class="mycont">
        I am container
    </div>
</body>
</html>
