<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selectors</title>
    <style>
        .box:first-child{
            background-color: blueviolet;
        }
        .box::first-line{
            color:beige
        }
        .boxes* {
            color: blue;
            border: 2px solid black;

        }

        /* [data-color="primary"] {
            padding-top: 45px;

        } */

        .boxes::after {
            content: "hello world";
        }
        ::selection{
            color:aqua
        }
    </style>
</head>

<body>
    <div class="boxes">
        <div /* data-color="primary" */class="box">Assalamoalaikum! I am first box.</div>
        <div class="box">Assalamoalaikum! I am a box.</div>
        <div class="box">Assalamoalaikum! I am a box.</div>
    </div>
</body>

</html>
