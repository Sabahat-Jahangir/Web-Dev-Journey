<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nave bar using flexbox</title>
    <style>
        .logo{
            
        }
        .logo img{
            height: 23px;
            width: 40px;
        }
        nav{
            display:flex;
            justify-content: space-around;
            align-items: center;
        }
        .right ul{
            display: flex;
            gap: 34px;
        }
        .right ul li{
            list-style-type: none;
            
        }
    </style>
</head>
<body>
     <header>
        <nav>
            <div class="logo">
                <img src="../../Projects/Beauty in Disorder (Art Gallery) - HTML/pics/image.png" alt="logo">
            </div>
            <div class="right">
                <ul>
                    <li>Products</li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>About Us</li>
                </ul>
            </div>

        </nav>
     </header>
</body>
</html>
