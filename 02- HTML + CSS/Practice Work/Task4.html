<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Design</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
    }

    .card {
        width: 400px;
        background: white;
        border-radius: 4px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        margin: 50px auto;
        overflow: hidden;
        text-align: center;
    }

    .card img {
        width: 100%;
        height: auto;
    }

    .card-title {
        padding: 15px;
        font-size: 18px;
        color: #555;
    }
</style>
</head>

<body>

<div class="card">
    <img width=188px
                src="https://images.pexels.com/photos/1362371/pexels-photo-1362371.jpeg?_gl=1*1nzerec*_ga*MTAzMTU0MDQ4NS4xNzcxNTE5MjQ1*_ga_8JE65Q40S6*czE3NzE1MTkyNDQkbzEkZzEkdDE3NzE1MTk0ODAkajUyJGwwJGgw"
                alt="">
    <div class="card-title">Cinque Terre</div>
</div>

</body>
</html>
