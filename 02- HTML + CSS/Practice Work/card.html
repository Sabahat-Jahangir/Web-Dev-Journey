<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        body {
            background-color: gray;
        }

        .card {
            background-color: white;
            width: 198px;
            height: 344px;
            border-radius: 8px;

        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 8px;
        }
        .content{
            font-size: 13px;
            padding: 7px;

        }
        .capsules{
            padding: 4px;
        }
        .capsules span{
            border: 2px solid black;
            padding: 2px 4px;
            border-radius: 7px;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 4px;
            border-radius: 12px;
            font-size: 12px;
            background-color: rgb(74, 142, 197);

        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width=188px
                src="https://images.pexels.com/photos/1362371/pexels-photo-1362371.jpeg?_gl=1*1nzerec*_ga*MTAzMTU0MDQ4NS4xNzcxNTE5MjQ1*_ga_8JE65Q40S6*czE3NzE1MTkyNDQkbzEkZzEkdDE3NzE1MTk0ODAkajUyJGwwJGgw"
                alt="">
        </div>
        <div class="capsules">
            <span>Beauty</span>
            <span>Disorder</span>
        </div>
            <div class="content">
                <h2>Psychocase</h2>
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Totam fuga voluptate sed, quis quas nemo
                    itaque cupiditate repellat hic perferendis nulla optio assumenda!.</p>
            </div>
            <div class="button">
                <button>Learn More</button>
            </div>
        
    </div>
</body>

</html>
