<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outline</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #c57575;
            outline: 2px solid green;
        }
        .text-element{
            text-shadow: 2px 2px 2px #c57575;
        }
    </style>
</head>
<body>
    <div class="box">I am box

    </div>
    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam, incidunt!</p>
</body>
</html>
